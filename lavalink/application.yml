lavalink:
  plugins:
    # YouTube Source com suporte a PO Token
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.11.3"
      repository: "https://maven.lavalink.dev/releases"
    # LavaSrc para SoundCloud como fallback
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.3.0"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "youshallnotpass"
    sources:
      youtube: false      # desativa source nativo — usamos o plugin
      bandcamp: true
      soundcloud: true
      twitch: false
      vimeo: false
      http: true
      local: false

# CORREÇÃO: Movido para a raiz do arquivo e renomeado para 'plugins'
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_TESTSUITE
      - WEB
      - TVHTML5EMBEDDED
    # Certifique-se de que o container está recebendo essas variáveis de ambiente corretamente
    poToken: "${PO_TOKEN:}"
    visitorData: "${VISITOR_DATA:}"

  lavasrc:
    providers:
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: false
      applemusic: false
      deezer: false
      yandexmusic: false
      youtube: true
      soundcloud: true

server:
  port: 2333
  address: 0.0.0.0

logging:
  level:
    root: INFO
    lavalink: INFO