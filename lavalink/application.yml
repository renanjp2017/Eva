lavalink:
  plugins:
    # YouTube Source com suporte a PO Token (Atualizado para v1.18.1)
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
    # LavaSrc como fallback (Atualizado para v4.8.3)
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "youshallnotpass"
    sources:
      youtube: false      # desativa source nativo — usamos o plugin
      bandcamp: true
      soundcloud: true
      twitch: false
      vimeo: false
      http: true
      local: false

# Configurações globais dos plugins (Raiz do arquivo)
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_TESTSUITE
      - WEB
      - TVHTML5_SIMPLY   # CORREÇÃO: TVHTML5EMBEDDED foi removido, use este no lugar
    # Certifique-se de preencher estas variáveis no seu ambiente ou Docker (.env)
    poToken: "${PO_TOKEN:}"
    visitorData: "${VISITOR_DATA:}"

  lavasrc:
    providers:
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: false
      applemusic: false
      deezer: false
      yandexmusic: false
      youtube: true
      soundcloud: true

server:
  port: 2333
  address: 0.0.0.0

logging:
  level:
    root: INFO
    lavalink: INFO
