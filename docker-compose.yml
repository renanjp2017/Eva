version: '3.8'

services:
  lavalink:
    image: fredboat/lavalink:v4.0.5
    container_name: lavalink
    restart: unless-stopped
    ports:
      - "2333:2333"
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
    environment:
      - _JAVA_OPTIONS=-Xmx1G

  eva_bot:
    build: .
    container_name: eva_bot
    restart: unless-stopped
    depends_on:
      - lavalink
    env_file:
      - .env
    volumes:
      - ./memoria.json:/app/memoria.json
